<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://brickyeda.github.io/digitalbag/logo.png">
  <link rel="apple-touch-icon" href="https://brickyeda.github.io/digitalbag/logo.png">
  
  <title>איפוס סיסמה - ילקוט דיגיטלי</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 90%;
      text-align: center;
    }
    h1 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    p {
      color: #7f8c8d;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #2c3e50;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
      direction: ltr;
      text-align: left;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://brickyeda.github.io/digitalbag/logo.png" alt="Logo" class="logo">
    <h1>🔐 איפוס סיסמה</h1>
    <p>הזן את הסיסמה החדשה שלך</p>
    
    <div id="message" class="message" style="display: none;"></div>
    
    <div id="resetForm">
      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" id="newPassword" placeholder="בחר סיסמה חזקה">
      </div>
      <div class="form-group">
        <label>אימות סיסמה</label>
        <input type="password" id="confirmPassword" placeholder="הזן סיסמה שוב">
      </div>
      <button onclick="handleResetPassword()">עדכן סיסמה</button>
    </div>
  </div>

  <script>
    console.log('🚀 FINAL VERSION LOADED!');
    
    // Supabase Configuration
    const SUPABASE_URL = 'https://ditiequwboxbiqrzvfhr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpdGllcXV3Ym94Ymlxcnp2ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzM2NjE2NTUsImV4cCI6MjA0OTIzNzY1NX0.JT0yDpX_gx0tSn6ZvU-CfF09AYUgc88ggdvbYBsREOI';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    function showMessage(text, isError = false) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + (isError ? 'error' : 'success');
      msg.style.display = 'block';
    }
    
    async function handleResetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (!newPassword || !confirmPassword) {
        showMessage('אנא מלא את כל השדות', true);
        return;
      }
      
      if (newPassword.length < 6) {
        showMessage('הסיסמה חייבת להכיל לפחות 6 תווים', true);
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showMessage('הסיסמאות אינן תואמות', true);
        return;
      }
      
      const btn = document.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'מעדכן...';
      
      try {
        // קבל tokens מה-URL
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        
        console.log('🔑 Tokens:', { 
          hasAccess: !!accessToken, 
          hasRefresh: !!refreshToken 
        });
        
        if (!accessToken || !refreshToken) {
          showMessage('שגיאה: לא נמצאו tokens', true);
          btn.disabled = false;
          btn.textContent = 'עדכן סיסמה';
          return;
        }
        
        console.log('📝 Setting session...');
        
        // הגדר session
        const { data: sess, error: sessErr } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        
        console.log('Session result:', { data: sess, error: sessErr });
        
        if (sessErr) {
          showMessage('שגיאה: ' + sessErr.message, true);
          btn.disabled = false;
          btn.textContent = 'עדכן סיסמה';
          return;
        }
        
        console.log('✅ Session OK, updating password...');
        
        // עדכן סיסמה
        const { data, error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });
        
        console.log('Update result:', { data, error });
        
        if (error) {
          showMessage('שגיאה: ' + error.message, true);
          btn.disabled = false;
          btn.textContent = 'עדכן סיסמה';
        } else {
          document.getElementById('resetForm').style.display = 'none';
          showMessage('✅ הסיסמה עודכנה! מעביר להתחברות...', false);
          
          await supabaseClient.auth.signOut();
          
          setTimeout(() => {
            window.location.href = 'login_FIXED_NOW.html';
          }, 2000);
        }
      } catch (err) {
        console.error('Error:', err);
        showMessage('שגיאה: ' + err.message, true);
        btn.disabled = false;
        btn.textContent = 'עדכן סיסמה';
      }
    }
    
    console.log('✅ Script loaded, ready!');
  </script>
</body>
</html>
