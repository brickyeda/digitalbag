<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://brickyeda.github.io/digitalbag/logo.png">
  <title>איפוס סיסמה</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 90%;
    }
    h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
    .logo { width: 80px; height: 80px; margin: 0 auto 20px; display: block; }
    p { color: #7f8c8d; text-align: center; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; text-align: right; }
    label { display: block; margin-bottom: 8px; color: #2c3e50; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1rem;
      direction: ltr;
      text-align: left;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      display: none;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://brickyeda.github.io/digitalbag/logo.png" class="logo">
    <h1>🔐 איפוס סיסמה</h1>
    <p id="info">ממתין לטעינה...</p>
    
    <div id="message" class="message"></div>
    
    <div id="form" style="display:none;">
      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" id="pass1" placeholder="לפחות 6 תווים">
      </div>
      <div class="form-group">
        <label>אימות סיסמה</label>
        <input type="password" id="pass2" placeholder="הזן שוב">
      </div>
      <button onclick="reset()">עדכן סיסמה</button>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(
      'https://ditiequwboxbiqrzvfhr.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpdGllcXV3Ym94Ymlxcnp2ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzM2NjE2NTUsImV4cCI6MjA0OTIzNzY1NX0.JT0yDpX_gx0tSn6ZvU-CfF09AYUgc88ggdvbYBsREOI'
    );
    
    function msg(text, isErr) {
      const m = document.getElementById('message');
      m.textContent = text;
      m.className = 'message ' + (isErr ? 'error' : 'success');
      m.style.display = 'block';
    }
    
    // המתן ש-Supabase יעבד את ה-hash
    setTimeout(async () => {
      const { data: { session } } = await sb.auth.getSession();
      
      if (session) {
        document.getElementById('info').textContent = 'הזן סיסמה חדשה';
        document.getElementById('form').style.display = 'block';
        console.log('✅ Session ready');
      } else {
        msg('הקישור לא תקף. בקש קישור חדש.', true);
        setTimeout(() => location.href = 'login_FIXED_NOW.html', 3000);
      }
    }, 1000);
    
    async function reset() {
      const p1 = document.getElementById('pass1').value;
      const p2 = document.getElementById('pass2').value;
      
      if (!p1 || !p2) return msg('מלא את כל השדות', true);
      if (p1.length < 6) return msg('לפחות 6 תווים', true);
      if (p1 !== p2) return msg('הסיסמאות לא תואמות', true);
      
      const btn = document.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'מעדכן...';
      
      try {
        const { error } = await sb.auth.updateUser({ password: p1 });
        
        if (error) {
          msg('שגיאה: ' + error.message, true);
          btn.disabled = false;
          btn.textContent = 'עדכן סיסמה';
        } else {
          msg('✅ הסיסמה עודכנה! מעביר...', false);
          await sb.auth.signOut();
          setTimeout(() => location.href = 'login_FIXED_NOW.html', 2000);
        }
      } catch (e) {
        msg('שגיאה: ' + e.message, true);
        btn.disabled = false;
        btn.textContent = 'עדכן סיסמה';
      }
    }
  </script>
</body>
</html>
