<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://brickyeda.github.io/digitalbag/logo.png">
  <title>איפוס סיסמה - ילקוט דיגיטלי</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 90%;
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 10px;
      font-size: 2rem;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: block;
    }
    p {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #2c3e50;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.3s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      display: none;
      font-weight: 500;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .toggle {
      text-align: center;
      margin-top: 20px;
      color: #7f8c8d;
    }
    .toggle a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .toggle a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://brickyeda.github.io/digitalbag/logo.png" class="logo">
    <h1>🔐 איפוס סיסמה</h1>
    <p id="statusText">אנא המתן...</p>
    
    <div id="message" class="message"></div>
    
    <div id="resetForm" style="display: none;">
      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" id="newPassword" placeholder="לפחות 6 תווים">
      </div>
      <div class="form-group">
        <label>אימות סיסמה</label>
        <input type="password" id="confirmPassword" placeholder="הזן שוב">
      </div>
      <button onclick="updatePassword()">עדכן סיסמה</button>
      <div class="toggle">
        <a href="index.html">חזור לאפליקציה</a>
      </div>
    </div>
  </div>

  <script>
    // הגדרות Supabase - בדיוק כמו בקובץ הראשי שלך
    const SUPABASE_URL = 'https://ditiequwboxbiqrzvfhr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpdGllcXV3Ym94Ymlxcnp2ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4NDQ4NDUsImV4cCI6MjA4MTQyMDg0NX0.HM6FhOilvJJnLpooweEQjuXmdUBEZ9jc-59jIS_be_k';
    
    let supabaseClient = null;
    
    function showMessage(text, isError = false) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + (isError ? 'error' : 'success');
      msg.style.display = 'block';
    }
    
    function updateStatusText(text) {
      document.getElementById('statusText').textContent = text;
    }
    
    // המתנה ל-Supabase SDK - בדיוק כמו בקובץ הראשי
    window.addEventListener('load', function() {
      console.log('🔄 דף נטען, בודק Supabase...');
      
      let attempts = 0;
      const maxAttempts = 20;
      
      function checkSupabase() {
        attempts++;
        console.log(`ניסיון ${attempts}/${maxAttempts}`);
        
        if (typeof window.supabase !== 'undefined') {
          console.log('✅ Supabase SDK נטען!');
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          initPasswordReset();
        } else if (attempts < maxAttempts) {
          setTimeout(checkSupabase, 100);
        } else {
          console.error('❌ Supabase SDK לא נטען');
          showMessage('שגיאה בטעינת המערכת. אנא רענן את הדף.', true);
        }
      }
      
      checkSupabase();
    });
    
    // אתחול איפוס סיסמה
    async function initPasswordReset() {
      console.log('🔑 מאתחל איפוס סיסמה...');
      console.log('🔗 URL:', window.location.href);
      console.log('🔗 Hash:', window.location.hash);
      
      // האזן לאירועי auth
      supabaseClient.auth.onAuthStateChange((event, session) => {
        console.log('🔐 Auth event:', event);
        console.log('📝 Session:', session);
        
        if (event === 'PASSWORD_RECOVERY') {
          console.log('✅ PASSWORD_RECOVERY event זוהה!');
          if (session && session.user) {
            updateStatusText('הזן סיסמה חדשה עבור: ' + session.user.email);
            document.getElementById('resetForm').style.display = 'block';
          }
        }
      });
      
      // גם נסה ישירות אחרי שנייה
      setTimeout(async () => {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        
        console.log('📊 Session check:', { session, error });
        
        if (error) {
          console.error('❌ שגיאה:', error);
          showMessage('שגיאה: ' + error.message, true);
          updateStatusText('הקישור לא תקף');
          setTimeout(() => window.location.href = 'index.html', 3000);
          return;
        }
        
        if (session && session.user) {
          console.log('✅ Session נמצא!');
          updateStatusText('הזן סיסמה חדשה עבור: ' + session.user.email);
          document.getElementById('resetForm').style.display = 'block';
        } else {
          console.warn('⚠️ עדיין לא נמצא session, ממתין...');
          // נסה שוב אחרי עוד שנייה
          setTimeout(async () => {
            const { data: { session: retrySession } } = await supabaseClient.auth.getSession();
            
            if (retrySession) {
              console.log('✅ Session נמצא בניסיון שני!');
              updateStatusText('הזן סיסמה חדשה עבור: ' + retrySession.user.email);
              document.getElementById('resetForm').style.display = 'block';
            } else {
              console.error('❌ הקישור לא תקף או פג תוקף');
              showMessage('הקישור לא תקף או פג תוקף. אנא בקש קישור חדש.', true);
              updateStatusText('הקישור לא תקף');
              setTimeout(() => window.location.href = 'index.html', 3000);
            }
          }, 1500);
        }
      }, 1000);
    }
    
    // עדכון סיסמה
    async function updatePassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // בדיקות
      if (!newPassword || !confirmPassword) {
        showMessage('אנא מלא את כל השדות', true);
        return;
      }
      
      if (newPassword.length < 6) {
        showMessage('הסיסמה חייבת להכיל לפחות 6 תווים', true);
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showMessage('הסיסמאות אינן תואמות', true);
        return;
      }
      
      // השבת כפתור
      const btn = document.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'מעדכן...';
      
      try {
        console.log('🔄 מעדכן סיסמה...');
        
        const { data, error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });
        
        if (error) {
          console.error('❌ שגיאה בעדכון:', error);
          showMessage('שגיאה: ' + error.message, true);
          btn.disabled = false;
          btn.textContent = 'עדכן סיסמה';
        } else {
          console.log('✅ סיסמה עודכנה בהצלחה!');
          showMessage('✅ הסיסמה עודכנה בהצלחה! מעביר לאפליקציה...', false);
          document.getElementById('resetForm').style.display = 'none';
          
          // המתן קצת ואז העבר לאפליקציה
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        }
      } catch (err) {
        console.error('❌ שגיאה:', err);
        showMessage('שגיאה: ' + err.message, true);
        btn.disabled = false;
        btn.textContent = 'עדכן סיסמה';
      }
    }
  </script>
</body>
</html>
